[package]
name = "fs-surveys-server"
description = "Cap'n Proto server of FreeSynergy surveys: the root of surveys.capnp (support report and the type catalog); the rest of the contract is not served yet"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-surveys-core = { path = "../fs-surveys-core" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11", features = ["rpc"] }
fs-types = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.0.11", features = ["rpc"] }
capnp = "0.27"
capnp-rpc = "0.27"

[dev-dependencies]
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.0.1" }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
