[package]
name = "fs-surveys-core"
description = "Program core of FreeSynergy surveys: surveys, anonymous ballots, results, widening over groups, decisions"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
fs-surveys-methods = { path = "../fs-surveys-methods" }
fs-objects = { git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.5.0" }
fs-interfaces = { git = "https://github.com/FreeSynergy/fs-interfaces", tag = "v0.45.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["sync"] }
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
tokio = { version = "1", features = ["full"] }
fs-groups-core = { git = "https://github.com/FreeSynergy/fs-groups", tag = "v0.2.0" }
# fs-groups-core v0.1.1 is built on fs-objects v0.2.0; the tests talk to it through ids as text.
fs-objects-02 = { package = "fs-objects", git = "https://github.com/FreeSynergy/fs-objects", tag = "v0.5.0" }
